<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Chess Game Analyzer (Chess.com & Lichess)</title>
    <meta name="description" content="Web-first chess game analysis app with Stockfish engine evaluation, phase Elo ratings, blunder diagnostics, interactive review dashboard, and 33-bot arena." />
    <meta property="og:title" content="Chess Game Analyzer (Chess.com & Lichess)" />
    <meta property="og:description" content="Web-first chess game analysis app with Stockfish engine evaluation, phase Elo ratings, blunder diagnostics, interactive review dashboard, and 33-bot arena." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS Engine CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: ['selector', '[data-bs-theme="dark"]'],
        theme: {
          extend: {
            colors: {
              arcade: {
                dark: '#0b0e14',
                surface: '#131722',
                card: '#1a202c',
                cardHover: '#232a3b',
                border: '#2d3748',
                gold: '#fbbf24',
                goldHover: '#f59e0b',
                emerald: '#10b981',
                rose: '#f43f5e',
                purple: '#8b5cf6',
                cyan: '#06b6d4',
              }
            },
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            }
          }
        }
      }
    </script>

    <!-- CDNs: Bootstrap 5.3.3 & Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./src/styles/comic-bootstrap.css">
  </head>
  <body>
    <!-- Top Navigation Bar -->
    <header class="navbar border-bottom sticky-top px-2.5 sm:px-4 py-2 glass-nav">
      <div class="container-fluid px-0 d-flex align-items-center justify-content-between flex-nowrap gap-1 sm:gap-3">
        <!-- Brand & Mode Switcher -->
        <div class="d-flex align-items-center gap-1.5 sm:gap-3 flex-shrink-0">
          <a class="navbar-brand d-flex align-items-center gap-1.5 fw-black mb-0 text-decoration-none logo-hover me-0" href="#">
            <span class="arcade-badge-logo">⚡</span>
            <span class="fw-black fs-6 sm:fs-5 tracking-tight font-sans">CHESS<span class="fg-warning">IQ</span></span>
          </a>

          <!-- Mode Switcher Pill Group -->
          <div class="arcade-mode-pills" role="group">
            <button type="button" class="arcade-pill active" id="nav-mode-review">
              <i class="bi bi-search me-1"></i><span>Review</span>
            </button>
            <button type="button" class="arcade-pill" id="nav-mode-bot">
              <i class="bi bi-robot me-1"></i><span class="d-none sm:inline">33 </span><span>Bots</span>
            </button>
          </div>
        </div>

        <!-- Right: Actions & Theme Toggle -->
        <div class="d-flex align-items-center gap-1.5 sm:gap-2 flex-shrink-0">
          <!-- Board Theme Dropdown (Bootstrap 5 Dropdown) -->
          <div class="dropdown">
            <button class="arcade-btn-icon" type="button" data-bs-toggle="dropdown" aria-expanded="false" title="Board Theme">
              <i class="bi bi-palette-fill"></i>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow border-0 glass-card">
              <li><button class="dropdown-item fw-bold d-flex align-items-center gap-2 py-2" data-board-theme="green"><span class="theme-dot" style="background:#739552;"></span> Tournament Green</button></li>
              <li><button class="dropdown-item fw-bold d-flex align-items-center gap-2 py-2" data-board-theme="wood"><span class="theme-dot" style="background:#b58863;"></span> Warm Wood</button></li>
              <li><button class="dropdown-item fw-bold d-flex align-items-center gap-2 py-2" data-board-theme="icy"><span class="theme-dot" style="background:#587a9f;"></span> Cyber Frost</button></li>
            </ul>
          </div>

          <!-- Sound Toggle (Mute / Unmute) -->
          <button type="button" class="arcade-btn-icon" id="nav-btn-sound" title="Toggle Sound">
            <i class="bi bi-volume-up-fill" id="sound-toggle-icon"></i>
          </button>

          <!-- Theme Toggle (Light / Dark) -->
          <button type="button" class="arcade-btn-icon" id="nav-btn-theme" title="Toggle Light/Dark Theme">
            <i class="bi bi-sun-fill fg-warning" id="theme-toggle-icon"></i>
          </button>

          <!-- Import Game Button (Bootstrap 5 Modal Trigger) -->
          <button type="button" class="arcade-btn-primary px-2.5 sm:px-3.5 py-1.5 d-flex align-items-center gap-1.5" id="nav-btn-import" data-bs-toggle="modal" data-bs-target="#import-modal" title="Import Game">
            <i class="bi bi-cloud-arrow-up-fill"></i>
            <span class="d-none sm:inline">Import</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Application Container -->
    <main class="container-fluid max-w-7xl px-2 sm:px-4 py-3 sm:py-4">
      <!-- Mode 1: Review Mode View -->
      <section id="review-view"></section>

      <!-- Mode 2: Play vs 33 Bots View -->
      <section id="bot-view" class="d-none"></section>
    </main>

    <!-- Bootstrap 5 Import Modal Container -->
    <div class="modal fade" id="import-modal" tabindex="-1" aria-labelledby="import-modal-label" aria-hidden="true"></div>

    <!-- CDNs: Bootstrap 5.3.3 Bundle, Chess.js & Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>

    <!-- Modular Application Bundles (Runs everywhere including direct file:// with zero CORS errors) -->
    <script src="./app-data.js"></script>
    <script src="./app-services.js"></script>
    <script src="./app-components.js"></script>
    <script src="./app-main.js"></script>
  </body>
</html>
