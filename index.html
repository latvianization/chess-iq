<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Chess Game Analyzer (Chess.com)</title>
    <meta name="description" content="Web-first chess game analysis app with Stockfish engine evaluation, phase Elo ratings, blunder diagnostics, interactive review dashboard, and 33-bot arena." />
    <meta property="og:title" content="Chess Game Analyzer (Chess.com)" />
    <meta property="og:description" content="Web-first chess game analysis app with Stockfish engine evaluation, phase Elo ratings, blunder diagnostics, interactive review dashboard, and 33-bot arena." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Tailwind CSS Engine CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        corePlugins: {
          visibility: false,
        },
        darkMode: ['selector', '[data-bs-theme="dark"]'],
        theme: {
          extend: {
            colors: {
              arcade: {
                dark: '#0b0e14',
                surface: '#131722',
                card: '#1a202c',
                cardHover: '#232a3b',
                border: '#2d3748',
                gold: '#fbbf24',
                goldHover: '#f59e0b',
                emerald: '#10b981',
                rose: '#f43f5e',
                purple: '#8b5cf6',
                cyan: '#06b6d4',
              }
            },
            fontFamily: {
              sans: ['system-ui', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif'],
              mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
            }
          }
        }
      }
    </script>

    <!-- CDNs: Bootstrap 5.3.3 & Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./src/styles/comic-bootstrap.css">
  </head>
  <body>
    <!-- Top Navigation Bar -->
    <header class="navbar border-bottom sticky-top px-2 px-sm-4 py-1.5 py-sm-2 glass-nav">
      <div class="container-fluid px-0 d-flex align-items-center justify-content-between flex-nowrap gap-1 sm:gap-3">
        <!-- Brand & Mode Switcher -->
        <div class="d-flex align-items-center gap-1.5 sm:gap-3 flex-shrink-0">
          <a class="navbar-brand d-flex align-items-center gap-1.5 fw-black mb-0 text-decoration-none logo-hover me-0" href="#" id="brand-logo" style="cursor: pointer;" aria-label="Chess IQ Home">
            <span class="arcade-badge-logo">⚡</span>
            <span class="fw-black fs-6 sm:fs-5 tracking-tight font-sans">CHESS<span class="fg-warning">IQ</span></span>
          </a>

          <!-- Mode Switcher Pill Group -->
          <div class="arcade-mode-pills" role="group">
            <button type="button" class="arcade-pill active" id="nav-mode-review" title="Review Game" aria-label="Review Game">
              <i class="bi bi-search me-0 me-sm-1"></i><span class="d-none d-sm-inline">Review</span>
            </button>
            <button type="button" class="arcade-pill" id="nav-mode-bot" title="Play vs Bots" aria-label="Play vs Bots">
              <i class="bi bi-robot me-0 me-sm-1"></i><span class="d-none d-md-inline">33 </span><span class="d-none d-sm-inline">Bots</span>
            </button>
          </div>
        </div>

        <!-- Right: Actions & Theme Toggle -->
        <div class="d-flex align-items-center gap-1 sm:gap-2 flex-shrink-0">
          <!-- Sound Toggle (Mute / Unmute) -->
          <button type="button" class="arcade-btn-icon" id="nav-btn-sound" aria-label="Toggle Sound" title="Toggle Sound">
            <i class="bi bi-volume-up-fill" id="sound-toggle-icon"></i>
          </button>

          <!-- Theme Toggle (Light / Dark) -->
          <button type="button" class="arcade-btn-icon" id="nav-btn-theme" aria-label="Toggle Theme" title="Toggle Theme">
            <i class="bi bi-sun-fill fg-warning" id="theme-toggle-icon"></i>
          </button>

          <!-- Help & Guide Modal Trigger -->
          <button type="button" class="arcade-btn-icon" id="nav-btn-help" aria-label="Chess IQ Guide & Glossary" title="Chess IQ Guide & Glossary">
            <i class="bi bi-question-circle-fill text-warning"></i>
          </button>

          <!-- Import Game Button (Bootstrap 5 Modal Trigger) -->
          <button type="button" class="arcade-btn-primary px-2.5 sm:px-3.5 py-1.5 d-flex align-items-center justify-content-center gap-1.5" id="nav-btn-import" data-bs-toggle="modal" data-bs-target="#import-modal" title="Import Game" aria-label="Import Game">
            <i class="bi bi-cloud-arrow-up-fill"></i>
            <span class="d-none d-sm-inline">Import</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Application Container -->
    <main class="container-fluid px-2 sm:px-3 lg:px-4 py-2 sm:py-2.5 w-100 app-main-container">
      <!-- Mode 1: Review Mode View -->
      <section id="review-view" class="w-100"></section>

      <!-- Mode 2: Play vs 33 Bots View -->
      <section id="bot-view" class="d-none w-100"></section>
    </main>

    <!-- Bootstrap 5 Import Modal Container -->
    <div class="modal fade" id="import-modal" tabindex="-1" aria-labelledby="import-modal-label" aria-hidden="true"></div>

    <!-- CDNs: Bootstrap 5.3.3 Bundle & Chess.js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script>
      // Polyfill modern chess.js camelCase methods for chess.js 0.10.x compatibility
      if (window.Chess && window.Chess.prototype) {
        var proto = window.Chess.prototype;
        if (!proto.loadPgn && typeof proto.load_pgn === 'function') proto.loadPgn = function(p, o) { return this.load_pgn(p, o); };
        if (!proto.isGameOver && typeof proto.game_over === 'function') proto.isGameOver = function() { return this.game_over(); };
        if (!proto.isCheckmate && typeof proto.in_checkmate === 'function') proto.isCheckmate = function() { return this.in_checkmate(); };
        if (!proto.isDraw && typeof proto.in_draw === 'function') proto.isDraw = function() { return this.in_draw(); };
        if (!proto.inCheck && typeof proto.in_check === 'function') proto.inCheck = function() { return this.in_check(); };
        if (!proto.isStalemate && typeof proto.in_stalemate === 'function') proto.isStalemate = function() { return this.in_stalemate(); };
        if (!proto.isThreefoldRepetition && typeof proto.in_threefold_repetition === 'function') proto.isThreefoldRepetition = function() { return this.in_threefold_repetition(); };
        if (!proto.isInsufficientMaterial && typeof proto.insufficient_material === 'function') proto.isInsufficientMaterial = function() { return this.insufficient_material(); };
      }
    </script>

    <!-- 1. Piece SVGs, Comic Badges, ECO Dictionary & Bot Profiles -->
    <script src="./src/components/pieceSvgs.js"></script>
    <script src="./src/services/comicBadges.js"></script>
    <script src="./src/services/ecoDictionary.js"></script>
    <script src="./src/data/botsData.js"></script>

    <!-- 2. Services & Analysis Engine -->
    <script src="./src/services/sound.js"></script>
    <script src="./src/services/stockfishWorker.js"></script>
    <script src="./src/services/engineEvaluationTables.js"></script>
    <script src="./src/services/engine.js"></script>
    <script src="./src/services/engineRefutations.js"></script>
    <script src="./src/services/gameCacheService.js"></script>
    <script src="./src/services/blunderBankService.js"></script>
    <script src="./src/services/tooltipService.js"></script>
    <script src="./src/services/importApi.js"></script>

    <!-- 3. UI Components -->
    <script src="./src/components/board.js"></script>
    <script src="./src/components/botGameOverModal.js"></script>
    <script src="./src/components/botArena.js"></script>
    <script src="./src/components/reviewAdvantageChart.js"></script>
    <script src="./src/components/reviewWhyModal.js"></script>
    <script src="./src/components/importModal.js"></script>
    <script src="./src/components/reviewDashboard.js"></script>

    <!-- 4. Application Coordinator -->
    <script src="./src/main.js"></script>
  </body>
</html>
