<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chess Game Analyzer (Chess.com)</title>
    <meta name="description" content="Web-first chess game analysis app with Stockfish engine evaluation, phase Elo ratings, blunder diagnostics, interactive review dashboard, and 33-bot arena." />
    <meta property="og:title" content="Chess Game Analyzer (Chess.com)" />
    <meta property="og:description" content="Web-first chess game analysis app with Stockfish engine evaluation, phase Elo ratings, blunder diagnostics, interactive review dashboard, and 33-bot arena." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Favicon & App Icons -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22bg%22%20x1%3D%220%25%22%20y1%3D%220%25%22%20x2%3D%22100%25%22%20y2%3D%22100%25%22%3E%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%23fbbf24%22%2F%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%23d97706%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20x%3D%222%22%20y%3D%222%22%20width%3D%2260%22%20height%3D%2260%22%20rx%3D%2214%22%20fill%3D%22url(%23bg)%22%20stroke%3D%22%23b45309%22%20stroke-width%3D%222%22%2F%3E%3Cpath%20d%3D%22M35%207L17%2033h15L26%2057l21-28H32z%22%20fill%3D%22%230b0e14%22%2F%3E%3C%2Fsvg%3E" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <!-- CDNs: Bootstrap 5.3.3 & Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./src/styles/comic-bootstrap.css">
  </head>
  <body>
    <!-- Top Navigation Bar -->
    <header class="navbar border-bottom sticky-top px-2 px-sm-4 py-1.5 py-sm-2 glass-nav">
      <div class="container-fluid px-0 d-flex align-items-center justify-content-between flex-nowrap gap-1.5 gap-sm-3">
        <!-- Brand & Mode Switcher -->
        <div class="d-flex align-items-center gap-1.5 gap-sm-3 flex-shrink-0">
          <a class="navbar-brand d-flex align-items-center gap-1.5 fw-black mb-0 text-decoration-none logo-hover me-0" href="#" id="brand-logo" data-iq-tip="nav_brand" style="cursor: pointer;" aria-label="Chess IQ Home">
            <span class="arcade-badge-logo">⚡</span>
            <span class="fw-black fs-6 fs-sm-5 tracking-tight font-sans">CHESS<span class="fg-warning">IQ</span></span>
          </a>

          <!-- Mode Switcher Pill Group -->
          <div class="arcade-mode-pills" role="group" aria-label="Application Mode">
            <button type="button" class="arcade-pill active" id="nav-mode-review" data-iq-tip="nav_review" aria-label="Review Game">
              <i class="bi bi-search me-1"></i><span>Review</span>
            </button>
            <button type="button" class="arcade-pill" id="nav-mode-bot" data-iq-tip="nav_bots" aria-label="Play vs Bots">
              <i class="bi bi-robot me-1"></i><span class="d-none d-md-inline">33 </span><span>Bots</span>
            </button>
          </div>
        </div>

        <!-- Right: Primary Import, Guide & Unified Settings Dropdown -->
        <div class="d-flex align-items-center gap-1.5 gap-sm-2 flex-shrink-0">
          <!-- Primary Action: Import Game (Modal Trigger) -->
          <button type="button" class="arcade-btn-primary px-2.5 px-sm-3.5 py-1.5 d-flex align-items-center justify-content-center gap-1.5" id="nav-btn-import" data-iq-tip="nav_import" aria-label="Import Game">
            <i class="bi bi-cloud-arrow-up-fill"></i>
            <span>Import</span>
          </button>

          <!-- Quick Feature Guide Button -->
          <button class="arcade-btn-icon d-none d-sm-inline-flex" type="button" id="nav-btn-help" data-iq-tip="nav_help" aria-label="Chess IQ Guide and Glossary">
            <i class="bi bi-question-circle-fill"></i>
          </button>

          <!-- Unified Settings & Options Dropdown -->
          <div class="dropdown">
            <button class="arcade-btn-icon" type="button" id="nav-options-dropdown" data-bs-toggle="dropdown" aria-expanded="false" title="Settings & Options" aria-label="Settings and Options">
              <i class="bi bi-gear-fill"></i>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow-lg py-2" aria-labelledby="nav-options-dropdown" style="min-width: 235px;">
              <li class="dropdown-header text-uppercase font-monospace fw-bold small text-secondary px-3 py-1">Display & Audio</li>
              <li>
                <button class="dropdown-item d-flex align-items-center justify-content-between py-1.5 px-3" id="menu-btn-theme" type="button">
                  <span><i class="bi bi-sun-fill me-2 text-warning" id="menu-theme-icon"></i>Theme Mode</span>
                  <span class="badge bg-secondary font-monospace" id="menu-theme-label">Light</span>
                </button>
              </li>
              <li>
                <button class="dropdown-item d-flex align-items-center justify-content-between py-1.5 px-3" id="menu-btn-sound" type="button">
                  <span><i class="bi bi-volume-up-fill me-2 text-primary" id="menu-sound-icon"></i>Sound Effects</span>
                  <span class="badge bg-success font-monospace" id="menu-sound-label">On</span>
                </button>
              </li>
              <li><hr class="dropdown-divider my-1.5"></li>
              <li class="dropdown-header text-uppercase font-monospace fw-bold small text-secondary px-3 py-1">Help & Storage</li>
              <li>
                <button class="dropdown-item d-flex align-items-center justify-content-between py-1.5 px-3" id="menu-btn-guide" type="button">
                  <span><i class="bi bi-book-half me-2 text-info"></i>Feature & Concept Guide</span>
                  <span class="badge bg-info text-dark font-monospace">IQ</span>
                </button>
              </li>
              <li>
                <button class="dropdown-item d-flex align-items-center py-1.5 px-3 text-danger" id="menu-btn-clear-cache" type="button">
                  <i class="bi bi-trash3-fill me-2"></i>Clear Saved Data
                </button>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Application Container -->
    <main class="container-fluid px-2 px-sm-3 px-lg-4 py-2 py-sm-2.5 w-100 app-main-container">
      <!-- Mode 1: Review Mode View -->
      <section id="review-view" class="w-100"></section>

      <!-- Mode 2: Play vs 33 Bots View -->
      <section id="bot-view" class="d-none w-100"></section>
    </main>

    <!-- Bootstrap 5 Import Modal Container -->
    <div class="modal fade" id="import-modal" tabindex="-1" aria-labelledby="import-modal-label" aria-hidden="true"></div>

    <!-- CDNs: Bootstrap 5.3.3 Bundle & Chess.js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script>
      // Polyfill modern chess.js camelCase methods for chess.js 0.10.x compatibility
      if (window.Chess && window.Chess.prototype) {
        var proto = window.Chess.prototype;
        if (!proto.loadPgn && typeof proto.load_pgn === 'function') proto.loadPgn = function(p, o) { return this.load_pgn(p, o); };
        if (!proto.isGameOver && typeof proto.game_over === 'function') proto.isGameOver = function() { return this.game_over(); };
        if (!proto.isCheckmate && typeof proto.in_checkmate === 'function') proto.isCheckmate = function() { return this.in_checkmate(); };
        if (!proto.isDraw && typeof proto.in_draw === 'function') proto.isDraw = function() { return this.in_draw(); };
        if (!proto.inCheck && typeof proto.in_check === 'function') proto.inCheck = function() { return this.in_check(); };
        if (!proto.isStalemate && typeof proto.in_stalemate === 'function') proto.isStalemate = function() { return this.in_stalemate(); };
        if (!proto.isThreefoldRepetition && typeof proto.in_threefold_repetition === 'function') proto.isThreefoldRepetition = function() { return this.in_threefold_repetition(); };
        if (!proto.isInsufficientMaterial && typeof proto.insufficient_material === 'function') proto.isInsufficientMaterial = function() { return this.insufficient_material(); };
      }
    </script>

    <!-- 1. Piece SVGs, Comic Badges, ECO Dictionary & Bot Profiles -->
    <script src="./src/components/pieceSvgs.js"></script>
    <script src="./src/services/comicBadges.js"></script>
    <script src="./src/services/ecoDictionary.js"></script>
    <script src="./src/data/botsData.js"></script>

    <!-- 2. Services & Analysis Engine -->
    <script src="./src/services/sound.js"></script>
    <script src="./src/services/stockfishWorker.js"></script>
    <script src="./src/services/engineEvaluationTables.js"></script>
    <script src="./src/services/engine.js"></script>
    <script src="./src/services/engineRefutations.js"></script>
    <script src="./src/services/gameCacheService.js"></script>
    <script src="./src/services/blunderBankService.js"></script>
    <script src="./src/services/modalHelper.js"></script>
    <script src="./src/services/tooltipService.js"></script>
    <script src="./src/services/importApi.js"></script>

    <!-- 3. UI Components -->
    <script src="./src/components/board.js"></script>
    <script src="./src/components/botGameOverModal.js"></script>
    <script src="./src/components/botArena.js"></script>
    <script src="./src/components/reviewAdvantageChart.js"></script>
    <script src="./src/components/reviewWhyModal.js"></script>
    <script src="./src/components/reviewWinningPathModal.js"></script>
    <script src="./src/components/reviewPillars.js"></script>
    <script src="./src/components/reviewOpeningModal.js"></script>
    <script src="./src/components/reviewBlunderBankModal.js"></script>
    <script src="./src/components/reviewReportModal.js"></script>
    <script src="./src/components/reviewTrainingModes.js"></script>
    <script src="./src/components/reviewMoveTable.js"></script>
    <script src="./src/components/importModal.js"></script>
    <script src="./src/components/reviewDashboard.js"></script>

    <!-- 4. Application Coordinator -->
    <script src="./src/main.js"></script>
  </body>
</html>
