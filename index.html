<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Chess Game Analyzer (Chess.com & Lichess)</title>
    <meta name="description" content="Web-first chess game analysis app with Stockfish engine evaluation, phase Elo ratings, blunder diagnostics, interactive review dashboard, and 33-bot arena." />
    <meta property="og:title" content="Chess Game Analyzer (Chess.com & Lichess)" />
    <meta property="og:description" content="Web-first chess game analysis app with Stockfish engine evaluation, phase Elo ratings, blunder diagnostics, interactive review dashboard, and 33-bot arena." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS Engine CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: ['selector', '[data-bs-theme="dark"]'],
        theme: {
          extend: {
            colors: {
              arcade: {
                dark: '#0b0e14',
                surface: '#131722',
                card: '#1a202c',
                cardHover: '#232a3b',
                border: '#2d3748',
                gold: '#fbbf24',
                goldHover: '#f59e0b',
                emerald: '#10b981',
                rose: '#f43f5e',
                purple: '#8b5cf6',
                cyan: '#06b6d4',
              }
            },
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            }
          }
        }
      }
    </script>

    <!-- CDNs: Bootstrap 6 Alpha & Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./src/styles/comic-bootstrap.css">
  </head>
  <body>
    <!-- Top Navigation Bar -->
    <header class="navbar lg:navbar-expand border-bottom sticky-top px-3 sm:px-4 py-2.5 glass-nav">
      <div class="container-fluid px-0 d-flex align-items-center justify-content-between">
        <!-- Brand & Mode Switcher -->
        <div class="d-flex align-items-center gap-3">
          <a class="navbar-brand d-flex align-items-center gap-2 fw-black mb-0 text-decoration-none logo-hover" href="#">
            <span class="arcade-badge-logo">⚡</span>
            <span class="fw-black fs-5 tracking-tight font-sans">CHESS<span class="fg-warning">IQ</span></span>
          </a>

          <!-- Mode Switcher Pill Group -->
          <div class="arcade-mode-pills" role="group">
            <button type="button" class="arcade-pill active" id="nav-mode-review">
              <i class="bi bi-search me-1.5"></i>Review
            </button>
            <button type="button" class="arcade-pill" id="nav-mode-bot">
              <i class="bi bi-robot me-1.5"></i>33 Bots
            </button>
          </div>
        </div>

        <!-- Right: Actions & Theme Toggle -->
        <div class="d-flex align-items-center gap-2">
          <!-- Board Theme Dropdown (Bootstrap 6 Menu) -->
          <div class="position-relative">
            <button class="arcade-btn-icon" type="button" data-bs-toggle="menu" aria-expanded="false" title="Board Theme">
              <i class="bi bi-palette-fill"></i>
            </button>
            <div class="menu menu-end shadow border-0 glass-card">
              <button class="menu-item fw-bold d-flex align-items-center gap-2 py-2" data-board-theme="green"><span class="theme-dot" style="background:#739552;"></span> Tournament Green</button>
              <button class="menu-item fw-bold d-flex align-items-center gap-2 py-2" data-board-theme="wood"><span class="theme-dot" style="background:#b58863;"></span> Warm Wood</button>
              <button class="menu-item fw-bold d-flex align-items-center gap-2 py-2" data-board-theme="icy"><span class="theme-dot" style="background:#587a9f;"></span> Cyber Frost</button>
            </div>
          </div>

          <!-- Theme Toggle (Light / Dark) -->
          <button type="button" class="arcade-btn-icon" id="nav-btn-theme" title="Toggle Light/Dark Theme">
            <i class="bi bi-sun-fill fg-warning" id="theme-toggle-icon"></i>
          </button>

          <!-- Import Game Button (Bootstrap 6 Dialog) -->
          <button type="button" class="arcade-btn-primary px-3.5 py-1.5" id="nav-btn-import" data-bs-toggle="dialog" data-bs-target="#import-modal">
            <i class="bi bi-cloud-arrow-up-fill me-1.5"></i>
            <span class="d-none sm:d-inline">Import Game</span>
            <span class="sm:d-none">Import</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Application Container -->
    <main class="container-fluid max-w-7xl px-2 sm:px-4 py-3 sm:py-4">
      <!-- Mode 1: Review Mode View -->
      <section id="review-view"></section>

      <!-- Mode 2: Play vs 33 Bots View -->
      <section id="bot-view" class="d-none"></section>
    </main>

    <!-- Bootstrap 6 Native Import Dialog -->
    <dialog class="dialog" id="import-modal"></dialog>

    <!-- CDNs: Bootstrap 6 ESM Module & Bridge, Chess.js & Canvas Confetti -->
    <script type="module">
      import * as bootstrap from 'https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js';
      window.bootstrap = bootstrap;
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>

    <!-- Standalone Application Entry Point (No CORS / Works directly from file://) -->
    <script src="./app.js"></script>
  </body>
</html>
